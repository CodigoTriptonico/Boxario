# Bloquea PR/main si falla el mismo gate local: typecheck + lint + architecture + duplicates + test:gate.
# No incluye quality:db, test:eval, E2E ni build (requieren Docker/Supabase o son más lentos).

name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality:gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality:gate
        run: npm run quality:gate
